<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poke-Semantle Ultimate</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root { --primary: #ff5252; --accent: #2c3e50; --bg: #f0f2f5; --border: #e1e4e8; --text-main: #333; --label: #888; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text-main); display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1000px; }
        
        header { text-align: center; margin-bottom: 25px; }
        h1 { margin: 0; color: var(--accent); font-weight: 900; letter-spacing: -0.5px; }
        
        /* 로딩 화면 및 셋업 화면 */
        #loadingArea { text-align: center; padding: 40px; }
        .spinner { border: 4px solid rgba(0,0,0,0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: var(--primary); animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .setup-box { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; display: none; }

        #gameArea { display: none; width: 100%; }
        .input-area { position: relative; width: 100%; max-width: 500px; margin: 0 auto 30px; z-index: 100; }
        .input-wrapper { display: flex; gap: 8px; }
        #guessInput { 
            flex: 1; padding: 14px 20px; border: 2px solid var(--border); border-radius: 12px; 
            font-size: 1.1rem; outline: none; transition: 0.2s; font-weight: bold; 
        }
        #guessInput:focus { border-color: var(--primary); }
        button.submit-btn { 
            padding: 0 24px; background: var(--accent); color: white; border: none; 
            border-radius: 12px; font-weight: bold; font-size: 1rem; cursor: pointer; 
        }

        #showRankBtn {
            display: none; margin: 20px auto; padding: 12px 24px;
            background: #4CAF50; color: white; border: none; border-radius: 30px;
            font-weight: bold; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
        }

        /* --- 리스트 & 카드 --- */
        .history-list { display: flex; flex-direction: column; gap: 12px; }
        .list-divider { text-align: center; font-size: 0.8rem; color: #999; font-weight: bold; margin: 15px 0; position: relative; }
        .list-divider::before { content:''; position: absolute; left: 0; top: 50%; width: 40%; height: 1px; background: #ddd; }
        .list-divider::after { content:''; position: absolute; right: 0; top: 50%; width: 40%; height: 1px; background: #ddd; }

        .card {
            background: white; border-radius: 12px; overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: 0.3s;
            border: 1px solid var(--border); cursor: pointer;
        }
        .card.expanded { box-shadow: 0 8px 20px rgba(0,0,0,0.1); border-color: var(--primary); }

        .card-header {
            position: relative; height: 60px; display: flex; align-items: center; padding: 0 15px;
            background: #fff; overflow: hidden;
        }
        .rank-gauge {
            position: absolute; top: 0; left: 0; bottom: 0; z-index: 0;
            transition: width 1s ease-out; opacity: 0.3;
        }
        .header-content { position: relative; z-index: 1; display: flex; align-items: center; width: 100%; gap: 15px; }
        .try-badge { font-size: 0.8rem; font-weight: bold; color: #888; width: 30px; }
        .mini-img { width: 40px; height: 40px; object-fit: contain; background: #f8f9fa; border-radius: 50%; border: 1px solid #ddd; }
        .header-name { flex: 1; font-weight: 800; font-size: 1.1rem; color: var(--accent); }
        .header-info { text-align: right; display: flex; gap: 15px; align-items: center; }
        .sim-score { font-size: 0.9rem; font-weight: 600; color: #555; }
        .rank-disp { font-size: 1.2rem; font-weight: 900; color: var(--primary); min-width: 60px; text-align: right; }

        .card-body {
            max-height: 0; opacity: 0; overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.4s ease;
            background: #fafafa; border-top: 1px solid #eee;
        }
        .card.expanded .card-body { max-height: 1000px; opacity: 1; padding: 20px; }

        /* --- 레이아웃 그리드 --- */
        .grid-layout { display: grid; grid-template-columns: 160px 1fr 180px; gap: 15px; }

        .col-left { display: flex; align-items: center; justify-content: center; border-right: 1px solid #eee; padding-right: 15px; }
        .big-img-box { width: 140px; height: 140px; background: white; border-radius: 16px; border: 1px solid #eee; display: flex; align-items: center; justify-content: center; }
        .big-img { width: 130px; height: 130px; object-fit: contain; }

        .col-mid { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: auto; gap: 8px 10px; align-content: center; }
        .info-row { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; line-height: 1.3; border-bottom: 1px dashed #e0e0e0; padding-bottom: 2px; }
        .label-text { font-size: 0.8rem; font-weight: bold; color: var(--label); min-width: 45px; }
        .val-text { font-weight: 600; color: #333; font-size: 0.9rem; letter-spacing: -0.3px; }

        .type-badge { padding: 1px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; border: 1px solid rgba(0,0,0,0.05); display: inline-block; margin-right: 3px; }
        .shape-icon { height: 24px; width: auto; vertical-align: middle; }

        .col-right { display: flex; flex-direction: column; align-items: center; justify-content: center; border-left: 1px solid #eee; padding-left: 10px; }
        .radar-chart-box { width: 100%; max-width: 180px; aspect-ratio: 1/1; position: relative; }

        #autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #ddd; z-index: 200; border-radius: 0 0 12px 12px; display: none; max-height: 250px; overflow-y: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .suggestion-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #f5f5f5; font-size: 0.95rem; }
        .suggestion-item:hover, .suggestion-item.active { background: #f1f8e9; color: var(--accent); font-weight: bold; }
        
        @media (max-width: 850px) {
            .grid-layout { grid-template-columns: 1fr; gap: 15px; }
            .col-left { border: none; padding: 0; padding-bottom: 15px; border-bottom: 1px solid #eee; }
            .col-mid { grid-template-columns: 1fr; gap: 8px; }
            .col-right { border: none; padding: 0; border-top: 1px solid #eee; padding-top: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Poke-Semantle Ultimate</h1>
        <p style="color:#777; font-size:0.9rem;">오늘의 포켓몬을 맞춰보세요!</p>
    </header>

    <div id="loadingArea">
        <div class="spinner"></div>
        <p>포켓몬 데이터를 불러오는 중입니다...</p>
    </div>

    <div id="setupArea" class="setup-box">
        <p>📁 <strong>pokemon_complete_korean_fixed_ver7.csv</strong> 파일을 선택하세요. (웹 자동 로딩 실패 시)</p>
        <div style="margin-top:15px;">
            <input type="file" id="dataFile" accept=".csv">
        </div>
    </div>

<div id="gameArea" style="display: none; width: 100%;">
        
        <div id="successArea" style="display: none; background: #e8f5e9; border: 2px solid #4caf50; border-radius: 16px; padding: 25px; text-align: center; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(76,175,80,0.15);">
            <h2 style="color: #2e7d32; margin: 0 0 15px 0; font-size: 1.6rem;">🎉 정답입니다! <span id="answerName" style="color: #ff5252;"></span>!!! 🎉</h2>
            <div style="background: white; border-radius: 12px; padding: 15px; display: inline-block; text-align: left; font-size: 1.05rem; line-height: 1.6; border: 1px solid #c8e6c9;">
                🔥 현재 연속 정답: <strong id="streakCount" style="color:#ff5252;">0</strong>회<br>
                🎯 이번 게임 도전 횟수: <strong id="tryCountDisplay" style="color:#ff5252;">0</strong>번<br>
                📈 정답 제외 최고 근접 순위: <strong id="bestRankDisplay" style="color:#ff5252;">-</strong>위
            </div>
            <div>
                <button id="showRankBtn" onclick="openRankingTab()">🏆 전체 순위 보기 (새 탭)</button>
            </div>
        </div>

        <div class="input-area" id="inputAreaDiv">
            <div id="errorMsg" style="color: #ff5252; font-weight: bold; margin-bottom: 10px; text-align: center; display: none; font-size: 0.95rem;"></div>
            
            <div class="input-wrapper">
                <input type="text" id="guessInput" placeholder="포켓몬 이름 입력..." autocomplete="off">
                <button class="submit-btn" onclick="handleGuess()">확인</button>
            </div>
            <div id="autocomplete-list"></div>
        </div>
        
        <div id="historyList" class="history-list"></div>
    </div>
</div>

<script>
    let db = [], allKoNames = [];
    let targetData = null, targetVec = null, globalRankList = [], history = [];
    let tryCount = 0;
    let expandedCards = new Set(); 
    // 👇 기존 변수들 밑에 아래 3줄을 추가해 주세요.
    let streak = parseInt(localStorage.getItem('pokeSemantleStreak')) || 0; // 연속 정답 횟수
    let bestRank = Infinity; // 이번 게임 최고 근접 순위
    let gameSolved = false;  // 정답을 맞췄는지 여부

    const sets = { types: new Set(), status: new Set(), shapes: new Set(), colors: new Set(), categories: new Set(), abilities: new Set() };
    const CSV_FILENAME = 'pokemon_complete_korean_fixed_ver7.csv';

    // 웹페이지 로드 시 자동 실행
    window.onload = async function() {
        try {
            const response = await fetch(CSV_FILENAME);
            if (!response.ok) throw new Error("네트워크 응답 없음");
            const txt = await response.text();
            parseData(txt);
            initGame();
        } catch (err) {
            // 로컬(C: 드라이브 등) 환경에서는 보안상 fetch가 막히므로 수동 업로드 창을 띄웁니다.
            document.getElementById('loadingArea').style.display = 'none';
            document.getElementById('setupArea').style.display = 'block';
        }
    };

    // 수동 파일 선택 처리
    document.getElementById('dataFile').onchange = e => {
        const file = e.target.files[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = (evt) => { parseData(evt.target.result); initGame(); };
        r.readAsText(file);
    };

    function parseData(txt) {
        db = []; allKoNames = [];
        const lines = txt.split(/\r?\n/);
        const h = lines[0].split(',').map(x => x.trim().replace(/^\ufeff/, ''));
        const get = (row, col) => { const idx = h.indexOf(col); return idx > -1 ? row[idx]?.trim() : null; };
        const getBool = (row, col) => {
            const val = get(row, col);
            return (val && val.toUpperCase() === 'TRUE');
        };

        db = lines.slice(1).filter(l => l.trim()).map(l => {
            const r = l.split(',');
            if (r.length < h.length) return null;
            let ko = get(r, 'name_ko');
            if (!ko) return null;
            ko = ko.normalize('NFC');
            allKoNames.push(ko);

            const isRegion = getBool(r, 'is_alolan') || getBool(r, 'is_galarian') || 
                             getBool(r, 'is_hisuian') || getBool(r, 'is_paldean');

            return {
                name: get(r, 'name_en') || get(r, 'name'),
                ko: ko,
                imagePath: get(r, 'image_path'),
                no: parseInt(get(r, 'pokedex_number')) || 0,
                gen: parseInt(get(r, 'generation')) || 0,
                status: get(r, 'status') || '일반', 
                category: get(r, 'category'),
                type: [get(r, 'type_1'), get(r, 'type_2')].filter(t => t && t !== 'None'),
                h: parseFloat(get(r, 'height_m')) || 0,
                w: parseFloat(get(r, 'weight_kg')) || 0,
                abilities: [get(r, 'ability_1'), get(r, 'ability_2')].filter(a => a && a !== 'None'),
                hidden: get(r, 'ability_hidden'),
                stats: {
                    hp: parseInt(get(r, 'hp')) || 0, atk: parseInt(get(r, 'attack')) || 0,
                    def: parseInt(get(r, 'defense')) || 0, spa: parseInt(get(r, 'sp_attack')) || 0,
                    spd: parseInt(get(r, 'sp_defense')) || 0, spe: parseInt(get(r, 'speed')) || 0,
                    total: parseInt(get(r, 'total_points')) || 0
                },
                shape: get(r, 'shape'),
                color: get(r, 'pokedex_color'),
                isMega: getBool(r, 'is_mega'), 
                isGmax: getBool(r, 'is_gigantamax'), 
                isRegion: isRegion,
                hasForms: getBool(r, 'has_forms') 
            };
        }).filter(Boolean);
    }

    function initGame() {
        db.forEach(p => {
            p.type.forEach(t => sets.types.add(t));
            if (p.status) sets.status.add(p.status);
            if (p.shape) sets.shapes.add(p.shape);
            if (p.color) sets.colors.add(p.color);
            if (p.category) sets.categories.add(p.category);
            p.abilities.forEach(a => sets.abilities.add(a));
            if (p.hidden) sets.abilities.add(p.hidden);
        });

        targetData = db[Math.floor(Math.random() * db.length)];
        targetVec = getVector(targetData);
        calculateGlobalRanks();
        
        document.getElementById('loadingArea').style.display = 'none';
        document.getElementById('setupArea').style.display = 'none';
        document.getElementById('gameArea').style.display = 'block';
    }

    function getVector(p) {
        let v = [];
        for(let g=1; g<=9; g++) v.push(p.gen === g ? 2.0 : 0);
        sets.status.forEach(s => v.push(p.status === s ? 2.0 : 0));
        sets.types.forEach(t => v.push(p.type.includes(t) ? 2.0 : 0));
        sets.categories.forEach(c => v.push(p.category === c ? 2.0 : 0));
        sets.shapes.forEach(s => v.push(p.shape === s ? 1.5 : 0));
        sets.colors.forEach(c => v.push(p.color === c ? 1.5 : 0));
        ['hp','atk','def','spa','spd','spe'].forEach(k => v.push((p.stats[k] / 255) * 1.5));
        v.push((p.h / 20) * 1.5); v.push((p.w / 999) * 1.5);
        const myAbils = new Set([...p.abilities]); if(p.hidden) myAbils.add(p.hidden);
        sets.abilities.forEach(a => v.push(myAbils.has(a) ? 1.5 : 0));
        v.push(p.isRegion ? 0.5 : 0); v.push(p.isGmax ? 0.5 : 0);
        v.push(p.isMega ? 0.5 : 0); v.push(p.hasForms ? 0.5 : 0);
        return v;
    }

    function calculateGlobalRanks() {
        globalRankList = db.map(p => {
            let s = calculateCosine(getVector(p), targetVec);
            if (p.no === targetData.no && p.name === targetData.name) s = 100;
            else if (p.no === targetData.no) s = Math.max(s, 99); 
            return { ...p, score: s };
        }).sort((a, b) => b.score - a.score);
        globalRankList.forEach((p, i) => { p.rank = i + 1; });
    }

    function calculateCosine(v1, v2) {
        let dot = 0, m1 = 0, m2 = 0;
        for (let i = 0; i < v1.length; i++) { dot += v1[i] * v2[i]; m1 += v1[i] ** 2; m2 += v2[i] ** 2; }
        return m1 === 0 || m2 === 0 ? 0 : (dot / (Math.sqrt(m1) * Math.sqrt(m2))) * 100;
    }

    function getImageUrl(p) {
        if (p.imagePath && p.imagePath.trim() !== "" && p.imagePath !== "None") return p.imagePath.trim();
        let slug = p.name.toLowerCase().replace(/['\.:%]/g, '').replace(/♀/g, '-f').replace(/♂/g, '-m').replace(/\s+/g, '-');
        if (slug === 'type-null') return `https://img.pokemondb.net/sprites/home/normal/2x/type-null.jpg`;
        return `https://img.pokemondb.net/sprites/home/normal/2x/${slug}.jpg`;
    }

/* --- 체형 이미지 1:1 매핑 (로컬 폴더 경로 사용) --- */
    function getShapeImg(shapeName) {
        if(!shapeName) return null;
        const map = {
            '머리형': './icons/Body01.png',
            '뱀형': './icons/Body02.png',
            '물고기형': './icons/Body03.png',
            '팔형': './icons/Body04.png',
            '기둥형': './icons/Body05.png',
            '이족꼬리형': './icons/Body06.png',
            '다리형': './icons/Body07.png',
            '사족형': './icons/Body08.png',
            '단익형': './icons/Body09.png',
            '다족형': './icons/Body10.png',
            '군집형': './icons/Body11.png',
            '인간형': './icons/Body12.png',
            '다익형': './icons/Body13.png',
            '곤충형': './icons/Body14.png'
        };
        return map[shapeName.trim()] || null;
    }

    const inputEl = document.getElementById('guessInput');
    const autoList = document.getElementById('autocomplete-list');
    let currentFocus = -1;

    inputEl.addEventListener('input', function() {
        const val = this.value.normalize('NFC'); closeAllLists(); if (!val) return; currentFocus = -1;
        const matches = allKoNames.filter(n => n.includes(val)).slice(0, 8);
        if (matches.length > 0) {
            autoList.style.display = 'block';
            matches.forEach(name => {
                const div = document.createElement('div'); div.className = 'suggestion-item';
                div.innerHTML = name.replace(new RegExp(`(${val})`, "i"), "<strong style='color:var(--primary)'>$1</strong>");
                div.addEventListener('click', () => { inputEl.value = name; closeAllLists(); inputEl.focus(); });
                autoList.appendChild(div);
            });
        }
    });

    inputEl.addEventListener('keydown', function(e) {
        if (e.isComposing || e.keyCode === 229) return;
        let x = autoList.getElementsByTagName('div');
        if (e.key === 'ArrowDown') { currentFocus++; addActive(x); }
        else if (e.key === 'ArrowUp') { currentFocus--; addActive(x); }
        else if (e.key === 'Enter') {
            e.preventDefault();
            if (currentFocus > -1 && x.length > 0) x[currentFocus].click(); else handleGuess();
        }
    });

    function addActive(x) {
        if (!x) return; removeActive(x);
        if (currentFocus >= x.length) currentFocus = 0;
        if (currentFocus < 0) currentFocus = x.length - 1;
        x[currentFocus].classList.add('active'); x[currentFocus].scrollIntoView({ block: "nearest" });
    }
    function removeActive(x) { for(let i=0; i<x.length; i++) x[i].classList.remove('active'); }
    function closeAllLists() { autoList.innerHTML = ''; autoList.style.display = 'none'; }
    document.addEventListener('click', e => { if (e.target !== inputEl) closeAllLists(); });

// 에러 텍스트 숨기기 (입력창에 글자를 칠 때마다 에러 메시지가 사라지게 함)
    inputEl.addEventListener('input', function() {
        document.getElementById('errorMsg').style.display = 'none';
        /* ... 기존 자동완성 로직 (const val = this.value.normalize('NFC'); 부터 쭉 유지) ... */
    });

    function handleGuess() {
        if (gameSolved) return; // 이미 정답을 맞췄으면 더 이상 입력 안 됨

        const errorEl = document.getElementById('errorMsg');
        errorEl.style.display = 'none';

        const val = inputEl.value.trim().normalize('NFC');
        if (!val) return;

        const pData = db.find(d => d.ko === val);

        // 1. 도감에 없는 경우 Alert 대신 빨간 텍스트 표시
        if (!pData) {
            errorEl.innerText = "🚨 도감에 없는 포켓몬입니다. 이름을 확인해 주세요!";
            errorEl.style.display = 'block';
            return;
        }

        // 2. 이미 입력한 경우 Alert 대신 빨간 텍스트 표시
        if (history.find(h => h.ko === val)) {
            errorEl.innerText = "🚨 이미 입력한 포켓몬입니다.";
            errorEl.style.display = 'block';
            inputEl.value = "";
            return;
        }

        // 정상 입력 처리
        const rankIdx = globalRankList.findIndex(x => x.name === pData.name);
        const currentRank = rankIdx + 1;
        tryCount++;

        // 정답이 아닐 경우 최고 근접 순위 갱신
        if (currentRank > 1 && currentRank < bestRank) {
            bestRank = currentRank;
        }

        history.unshift({ ...pData, rank: currentRank, score: globalRankList[rankIdx].score, tryNo: tryCount });
        
        renderHistory();
        inputEl.value = "";
        autoList.style.display = 'none';

        // 3. 정답을 맞췄을 때 이벤트 실행
        if (currentRank === 1) {
            handleWin(val);
        }
    }

    // 🎉 정답을 맞췄을 때 실행되는 함수
    function handleWin(pokemonName) {
        gameSolved = true;
        streak++; // 연속 정답 추가
        localStorage.setItem('pokeSemantleStreak', streak); // 저장

        // UI 변경: 입력창 숨기고 축하 영역 보이기
        document.getElementById('inputAreaDiv').style.display = 'none';
        document.getElementById('successArea').style.display = 'block';
        
        // 데이터 채워 넣기
        document.getElementById('answerName').innerText = pokemonName;
        document.getElementById('streakCount').innerText = streak;
        document.getElementById('tryCountDisplay').innerText = tryCount;
        document.getElementById('bestRankDisplay').innerText = bestRank === Infinity ? '-' : bestRank;
        document.getElementById('showRankBtn').style.display = 'inline-block';

        // 🎊 화려한 꽃가루(Confetti) 이펙트 실행
        if (typeof confetti === 'function') {
            const duration = 3000; // 3초 동안
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

            function randomInRange(min, max) { return Math.random() * (max - min) + min; }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);
                
                const particleCount = 50 * (timeLeft / duration);
                // 양쪽에서 팡팡 터지는 효과
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }
    }

    // 4. 성공 시 로직 (정답 처리 및 히스토리 추가)
    const rankIdx = globalRankList.findIndex(x => x.name === pData.name);
    tryCount++;
    history.unshift({ ...pData, rank: rankIdx + 1, score: globalRankList[rankIdx].score, tryNo: tryCount });
    
    renderHistory();
    inputEl.value = "";
    autoList.style.display = 'none';

    if (rankIdx === 0) {
        alert(`🎉 정답입니다! ${val}!!!`);
        document.getElementById('showRankBtn').style.display = 'block';
    }
}

    function renderHistory() {
        const container = document.getElementById('historyList');
        container.innerHTML = '';
        if (history.length === 0) return;

        const latest = history[0];
        const others = history.slice(1).sort((a, b) => a.rank - b.rank); 
        
        container.appendChild(createCard(latest, true, true));

        if (others.length > 0) {
             const div = document.createElement('div');
             div.className = 'list-divider'; div.innerText = '순위별 정렬';
             container.appendChild(div);
        }

        others.forEach(p => {
            const isExpandedInSet = expandedCards.has(p.ko);
            container.appendChild(createCard(p, isExpandedInSet, true));
        });
    }

    function getRadarChartSVG(stats) {
        const size = 130; const center = size / 2; const radius = 42; const maxVal = 255; 
        const keys = ['hp', 'atk', 'def', 'spe', 'spd', 'spa'];
        const labels = ['HP', '공격', '방어', '스피드', '특방', '특공'];
        const angleSlice = (Math.PI * 2) / 6;
        const getPoint = (val, i) => {
            const angle = i * angleSlice - (Math.PI / 2);
            const r = (val / maxVal) * radius;
            return `${center + r * Math.cos(angle)},${center + r * Math.sin(angle)}`;
        };
        const points = keys.map((k, i) => getPoint(stats[k], i)).join(' ');
        const bgPoints = keys.map((_, i) => getPoint(maxVal, i)).join(' ');
        const mdPoints = keys.map((_, i) => getPoint(maxVal * 0.5, i)).join(' ');

        const labelHtml = labels.map((l, i) => {
            const angle = i * angleSlice - (Math.PI / 2);
            const r_label = radius + 16; 
            const x = center + r_label * Math.cos(angle);
            const y = center + r_label * Math.sin(angle);
            const val = stats[keys[i]];
            return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#555" font-weight="bold"><tspan x="${x}" dy="-5">${l}</tspan><tspan x="${x}" dy="11" font-weight="normal" fill="#333">${val}</tspan></text>`;
        }).join('');

        return `<svg viewBox="-5 -5 140 140" class="radar-svg"><polygon points="${bgPoints}" fill="#f8f8f8" stroke="#ddd" stroke-width="0.8"></polygon><polygon points="${mdPoints}" fill="none" stroke="#eee" stroke-width="0.8" stroke-dasharray="2,2"></polygon><polygon points="${points}" fill="rgba(255, 82, 82, 0.3)" stroke="#ff5252" stroke-width="1.5"></polygon>${labelHtml}</svg>`;
    }

    function createCard(p, isExpanded, isInteractive) {
        const el = document.createElement('div');
        el.className = `card ${isExpanded ? 'expanded' : ''}`;
        
        if (isInteractive) {
            el.onclick = function(e) { 
                if(window.getSelection().toString().length === 0) {
                    if (el.classList.contains('expanded')) {
                        el.classList.remove('expanded'); expandedCards.delete(p.ko);
                    } else {
                        el.classList.add('expanded'); expandedCards.add(p.ko);
                    }
                }
            };
        }

        const imgUrl = getImageUrl(p);
        const typeHtml = p.type.map(t => `<span class="type-badge" style="background:${getPastelColor(t)}; color:${getTypeColor(t)}">${t}</span>`).join('');
        const colorDot = getColorCode(p.color);
        const total = db.length;
        const gaugePercent = Math.max(5, ((total - p.rank) / total) * 100);
        const gaugeColor = p.rank === 1 ? '#ff5252' : `rgba(255, 82, 82, ${Math.max(0.1, gaugePercent/100)})`;

        let boolTags = [];
        if(p.isMega) boolTags.push("메가진화");
        if(p.isGmax) boolTags.push("거다이맥스");
        if(p.isRegion) boolTags.push("리전폼");
        if(p.hasForms) boolTags.push("여러모습");

        const boolStr = boolTags.length > 0 ? boolTags.join(', ') : "없음";
        const radarSvg = getRadarChartSVG(p.stats);
        const hiddenStr = p.hidden ? p.hidden : "없음";
        
        // 체형 이미지 파싱 함수 호출
        const shapeImgSrc = getShapeImg(p.shape);
        const shapeContent = shapeImgSrc 
            ? `<img src="${shapeImgSrc}" class="shape-icon" alt="${p.shape}" title="${p.shape}">`
            : p.shape; // 매핑 안되면 글자로 폴백

        el.innerHTML = `
            <div class="card-header">
                <div class="rank-gauge" style="width:${gaugePercent}%; background:${gaugeColor};"></div>
                <div class="header-content">
                    <span class="try-badge">${p.tryNo ? '#'+p.tryNo : '-'}</span>
                    <img src="${imgUrl}" class="mini-img" onerror="this.src='https://via.placeholder.com/40'">
                    <span class="header-name">${p.ko}</span>
                    <div class="header-info">
                        <span class="sim-score">${p.score.toFixed(2)}%</span>
                        <span class="rank-disp">${p.rank}위</span>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="grid-layout">
                    <div class="col-left"><div class="big-img-box"><img src="${imgUrl}" class="big-img"></div></div>
                    <div class="col-mid">
                        <div class="info-row"><span class="label-text">이름:</span><span class="val-text">${p.ko}</span></div>
                        <div class="info-row"><span class="label-text">세대:</span><span class="val-text">${p.gen}세대</span></div>
                        
                        <div class="info-row"><span class="label-text">번호:</span><span class="val-text">${String(p.no).padStart(4,'0')}</span></div>
                        <div class="info-row"><span class="label-text">분류:</span><span class="val-text">${p.category || '-'}</span></div>
                        
                        <div class="info-row"><span class="label-text">구분:</span><span class="val-text">${p.status}포켓몬</span></div>
                        <div class="info-row"><span class="label-text">타입:</span><div>${typeHtml}</div></div>
                        
                        <div class="info-row"><span class="label-text">특성:</span><span class="val-text">${p.abilities.join(', ')}</span></div>
                        <div class="info-row"><span class="label-text">체형:</span><span class="val-text">${shapeContent}</span></div>
                        
                        <div class="info-row"><span class="label-text">숨특:</span><span class="val-text">${hiddenStr}</span></div>
                        <div class="info-row">
                            <span class="label-text">색상:</span>
                            <span class="val-text" style="display:inline-flex;align-items:center;gap:4px;">
                                ${p.color} <span style="width:10px;height:10px;border-radius:50%;background:${colorDot};border:1px solid #ccc;"></span>
                            </span>
                        </div>
                        
                        <div class="info-row"><span class="label-text">기타:</span><span class="val-text">${boolStr}</span></div>
                        <div class="info-row"><span class="label-text">크기:</span><span class="val-text">${p.h}m / ${p.w}kg</span></div>
                    </div>
                    <div class="col-right">
                        <div class="radar-chart-box">${radarSvg}</div>
                    </div>
                </div>
            </div>
        `;
        return el;
    }

    // --- 새 탭 순위 보기 ---
    function openRankingTab() {
        const newWin = window.open('', '_blank');
        if(!newWin) return alert('팝업 차단을 해제해주세요.');
        
        const styles = document.querySelector('style').innerHTML;
        const topList = globalRankList.slice(0, 100); 
        
        const tempContainer = document.createElement('div');
        topList.forEach(p => {
            tempContainer.appendChild(createCard(p, false, false));
        });
        const cardsHtml = tempContainer.innerHTML;

        newWin.document.write(`
            <!DOCTYPE html>
            <html lang="ko">
            <head>
                <meta charset="UTF-8">
                <title>전체 순위 (TOP 100)</title>
                <style>
                    ${styles}
                    body { padding: 40px; overflow-y: auto; align-items: center; }
                    .container { max-width: 900px; margin: 0 auto; }
                    
                    /* 카드 사이 간격 확 줄이기! */
                    .history-list { gap: 6px !important; }
                    .card { margin-bottom: 0px !important; cursor: pointer; border-radius: 8px; }
                    .card:hover { box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
                </style>
            </head>
            <body>
                <div class="container">
                    <header>
                        <h1>🏆 전체 순위 (TOP 100)</h1>
                        <p>카드를 클릭하면 상세 정보를 볼 수 있습니다.</p>
                    </header>
                    <div class="history-list">
                        ${cardsHtml}
                    </div>
                </div>
                <script>
                    document.querySelectorAll('.card').forEach(card => {
                        card.addEventListener('click', () => {
                            card.classList.toggle('expanded');
                        });
                    });
                <\/script>
            </body>
            </html>
        `);
        newWin.document.close();
    }

    // 유틸
    function getTypeColor(t) {
        const map = {
            '노말':'#6D6D4E', '불꽃':'#9C531F', '물':'#445E9C', '전기':'#A1871F', '풀':'#4E8234', '얼음':'#638D8D',
            '격투':'#7D1F1A', '독':'#682A68', '땅':'#927D44', '비행':'#6D5E9C', '에스퍼':'#9C295B', '벌레':'#6D7815',
            '바위':'#786824', '고스트':'#493963', '드래곤':'#4924A1', '악':'#49392F', '강철':'#787887', '페어리':'#9B4A7D',
            'Normal':'#6D6D4E'
        };
        return map[t] || '#555';
    }
    function getPastelColor(t) {
        const map = {
            '노말':'#A8A77A', '불꽃':'#EE8130', '물':'#6390F0', '전기':'#F7D02C', '풀':'#7AC74C', '얼음':'#96D9D6',
            '격투':'#C22E28', '독':'#A33EA1', '땅':'#E2BF65', '비행':'#A98FF3', '에스퍼':'#F95587', '벌레':'#A6B91A',
            '바위':'#B6A136', '고스트':'#735797', '드래곤':'#6F35FC', '악':'#705746', '강철':'#B7B7CE', '페어리':'#D685AD',
            'Normal':'#A8A77A'
        };
        const c = map[t] || '#cccccc';
        const r = parseInt(c.slice(1,3), 16), g = parseInt(c.slice(3,5), 16), b = parseInt(c.slice(5,7), 16);
        return `rgba(${r},${g},${b},0.2)`;
    }
    function getColorCode(c) {
        const map = {
            '빨강':'#ff5252', '파랑':'#2196f3', '노랑':'#fdd835', '초록':'#4caf50', '검정':'#333', 
            '갈색':'#795548', '보라':'#9c27b0', '회색':'#9e9e9e', '하양':'#eee', '분홍':'#f48fb1',
            '담홍':'#f48fb1', 'Pink':'#f48fb1' 
        };
        return map[c] || '#ddd';
    }
</script>
