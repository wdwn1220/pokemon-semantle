<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poke-Semantle Ultimate</title>
    <link rel="icon" type="image/png" href="pokemon%20semantle%20icon.png">
    <link rel="apple-touch-icon" href="pokemon%20semantle%20icon.png">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root { --primary: #ff5252; --accent: #2c3e50; --bg: #f0f2f5; --border: #e1e4e8; --text-main: #333; --label: #888; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text-main); display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1000px; }
        
        header { text-align: center; margin-bottom: 25px; }
        h1 { margin: 0; color: var(--accent); font-weight: 900; letter-spacing: -0.5px; }
        
        /* 로딩 및 셋업 화면 */
        #loadingArea { text-align: center; padding: 40px; }
        .spinner { border: 4px solid rgba(0,0,0,0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: var(--primary); animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .setup-box { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; display: none; }

        #gameArea { display: none; width: 100%; }
        
        /* 🎉 성공/축하 영역 */
        #successArea { display: none; background: #e8f5e9; border: 2px solid #4caf50; border-radius: 16px; padding: 25px; text-align: center; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(76,175,80,0.15); animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }
        .success-title { color: #2e7d32; margin: 0 0 15px 0; font-size: 1.6rem; font-weight: 900; }
        .success-stats-grid { display: grid; grid-template-columns: repeat(3, minmax(180px, 1fr)); gap: 12px; margin-top: 15px; }
        .success-stat-card { background: white; border-radius: 12px; border: 1px solid #c8e6c9; padding: 14px; text-align: left; box-shadow: 0 2px 8px rgba(76,175,80,0.08); }
        .success-stat-title { margin: 0 0 10px 0; font-size: 0.95rem; font-weight: 800; color: #2e7d32; }
        .success-stat-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; margin-top: 6px; }
        .success-stat-label { color: #4a4a4a; }
        .success-stat-value { font-weight: 900; color: #ff5252; }

        @media (max-width: 760px) {
            .success-stats-grid { grid-template-columns: 1fr; }
        }
        
        /* 입력창 영역 */
        .input-area { position: relative; width: 100%; max-width: 500px; margin: 0 auto 30px; z-index: 100; }
        .input-wrapper { display: flex; gap: 8px; }
        #guessInput { flex: 1; padding: 14px 20px; border: 2px solid var(--border); border-radius: 12px; font-size: 1.1rem; outline: none; transition: 0.2s; font-weight: bold; }
        #guessInput:focus { border-color: var(--primary); }
        button.submit-btn { padding: 0 24px; background: var(--accent); color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        button.submit-btn:hover { background: #1a252f; }
        
        /* 🚨 에러 메시지 */
        #errorMsg { color: #d32f2f; background: #ffebee; border: 1px solid #ffcdd2; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 0.95rem; margin-bottom: 10px; text-align: center; display: none; animation: shake 0.4s; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }

        #showRankBtn { margin: 20px auto; padding: 12px 24px; background: #4CAF50; color: white; border: none; border-radius: 30px; font-weight: bold; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3); transition: 0.2s; }
        #showRankBtn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(76, 175, 80, 0.4); }

        /* --- 리스트 & 카드 --- */
        .history-list { display: flex; flex-direction: column; gap: 12px; }
        .list-divider { text-align: center; font-size: 0.8rem; color: #999; font-weight: bold; margin: 15px 0; position: relative; }
        .list-divider::before { content:''; position: absolute; left: 0; top: 50%; width: 40%; height: 1px; background: #ddd; }
        .list-divider::after { content:''; position: absolute; right: 0; top: 50%; width: 40%; height: 1px; background: #ddd; }

        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid var(--border); cursor: pointer; }
        .card.expanded { box-shadow: 0 8px 20px rgba(0,0,0,0.1); border-color: var(--primary); }
        .card-header { position: relative; height: 60px; display: flex; align-items: center; padding: 0 15px; background: #fff; overflow: hidden; }
        .rank-gauge { position: absolute; top: 0; left: 0; bottom: 0; z-index: 0; transition: width 1s ease-out; }
        .header-content { position: relative; z-index: 1; display: flex; align-items: center; width: 100%; gap: 15px; }
        .try-badge { font-size: 0.8rem; font-weight: 900; color: #1f2937; background: #eef2f7; border: 1px solid #cfd8e3; border-radius: 8px; width: 38px; text-align: center; padding: 2px 0; }
        .mini-img { width: 40px; height: 40px; object-fit: contain; background: #f8f9fa; border-radius: 50%; border: 1px solid #ddd; }
        .header-name { flex: 1; font-weight: 800; font-size: 1.1rem; color: var(--accent); }
        
        /* ✅ 배경이 진해져도 무조건 잘 보이는 랭크/일치율 캡슐 디자인 */
        .rank-score-wrapper { display: flex; align-items: center; background: rgba(255, 255, 255, 0.85); padding: 4px 12px; border-radius: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); margin-left: auto; gap: 6px; }
        .score-disp { font-size: 0.95rem; color: #555; font-weight: 700; }
        .rank-disp { font-size: 1.2rem; font-weight: 900; color: var(--primary); }

        .card-body { display: none; overflow: hidden; background: #fafafa; border-top: 1px solid #eee; }
        .card.expanded .card-body { display: block; padding: 20px; }

        .grid-layout { display: grid; grid-template-columns: 160px 1fr 180px; gap: 15px; }
        .col-left { display: flex; align-items: center; justify-content: center; border-right: 1px solid #eee; padding-right: 15px; }
        .big-img-box { width: 140px; height: 140px; background: white; border-radius: 16px; border: 1px solid #eee; display: flex; align-items: center; justify-content: center; }
        .big-img { width: 130px; height: 130px; object-fit: contain; }

        .col-mid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; align-content: center; }
        .info-column { display: flex; flex-direction: column; gap: 8px; }
        .info-row { display: flex; align-items: center; gap: 6px; border-bottom: 1px dashed #e0e0e0; padding-bottom: 4px; }
        
        .label-text { font-size: 0.8rem; font-weight: bold; color: var(--label); min-width: 40px; }
        .val-text { font-weight: 600; color: #333; font-size: 0.9rem; letter-spacing: -0.3px; display: inline-flex; align-items: center; gap: 4px; }
        .type-badge { padding: 1px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; border: 1px solid rgba(0,0,0,0.05); display: inline-block; margin-right: 3px; }
        .shape-icon { height: 26px; width: auto; vertical-align: middle; }

        .col-right { display: flex; flex-direction: column; align-items: center; justify-content: center; border-left: 1px solid #eee; padding-left: 10px; }
        .radar-chart-box { width: 100%; max-width: 180px; aspect-ratio: 1/1; position: relative; }

        #autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #ddd; z-index: 200; border-radius: 0 0 12px 12px; display: none; max-height: 250px; overflow-y: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .suggestion-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #f5f5f5; font-size: 0.95rem; }
        .suggestion-item:hover, .suggestion-item.active { background: #f1f8e9; color: var(--accent); font-weight: bold; }
        
        @media (max-width: 850px) {
            .grid-layout { grid-template-columns: 1fr; gap: 15px; }
            .col-left { border: none; padding-bottom: 15px; border-bottom: 1px solid #eee; }
            .col-mid { grid-template-columns: 1fr; }
            .col-right { border: none; border-top: 1px solid #eee; padding-top: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Poke-Semantle Ultimate</h1>
        <p style="color:#777; font-size:0.9rem;">오늘의 포켓몬을 맞춰보세요!</p>
    </header>

    <div id="loadingArea">
        <div class="spinner"></div>
        <p>포켓몬 데이터를 불러오는 중입니다...</p>
    </div>

    <div id="setupArea" class="setup-box">
        <p>📁 <strong>pokemon_complete_korean_fixed_ver7.csv</strong> 파일을 선택하세요.</p>
        <div style="margin-top:15px;"><input type="file" id="dataFile" accept=".csv"></div>
    </div>

    <div id="gameArea">
        <div id="successArea">
            <h2 class="success-title">🎉 정답입니다! <span id="answerName" style="color: #ff5252;"></span>!!! 🎉</h2>
            <div class="success-stats-grid">
                <div class="success-stat-card">
                    <h3 class="success-stat-title">📈 순위</h3>
                    <div class="success-stat-row"><span class="success-stat-label">이번 최고</span><strong class="success-stat-value" id="bestRankDisplay">-</strong></div>
                    <div class="success-stat-row"><span class="success-stat-label">역대 최고 중 최저</span><strong class="success-stat-value" id="worstBestRankDisplay">-</strong></div>
                </div>
                <div class="success-stat-card">
                    <h3 class="success-stat-title">🎯 시도</h3>
                    <div class="success-stat-row"><span class="success-stat-label">이번 시도 수</span><strong class="success-stat-value" id="tryCountDisplay">0</strong></div>
                    <div class="success-stat-row"><span class="success-stat-label">평균 시도 수</span><strong class="success-stat-value" id="avgTryDisplay">-</strong></div>
                </div>
                <div class="success-stat-card">
                    <h3 class="success-stat-title">🔥 연속</h3>
                    <div class="success-stat-row"><span class="success-stat-label">현재 연속</span><strong class="success-stat-value" id="streakCount">0</strong></div>
                    <div class="success-stat-row"><span class="success-stat-label">최다 연속</span><strong class="success-stat-value" id="maxStreakDisplay">0</strong></div>
                </div>
            </div>
            <div>
                <button id="showRankBtn" onclick="openRankingTab()">🏆 전체 순위 보기</button>
            </div>
        </div>

        <div class="input-area" id="inputAreaDiv">
            <div id="errorMsg">에러 메시지 영역</div>
            
            <div class="input-wrapper">
                <input type="text" id="guessInput" placeholder="포켓몬 이름 입력..." autocomplete="off">
                <button class="submit-btn" onclick="handleGuess()">확인</button>
            </div>
            <div id="autocomplete-list"></div>
        </div>
        
        <div id="historyList" class="history-list"></div>
    </div>
</div>

<script>
    let db = [], allKoNames = [];
    let targetData = null, targetVec = null, globalRankList = [], history = [];
    let tryCount = 0;
    let expandedCards = new Set();
    
    let streak = parseInt(localStorage.getItem('pokeSemantleStreak')) || 0;
    let maxStreak = parseInt(localStorage.getItem('pokeSemantleMaxStreak')) || 0;
    if (streak > maxStreak) maxStreak = streak;
    let solvedGameCount = parseInt(localStorage.getItem('pokeSemantleSolvedGameCount')) || 0;
    let totalTrySum = parseInt(localStorage.getItem('pokeSemantleTotalTrySum')) || 0;
    let worstBestRank = parseInt(localStorage.getItem('pokeSemantleWorstBestRank')) || 0;
    let bestRank = Infinity;
    let gameSolved = false;

    const sets = { types: new Set(), status: new Set(), shapes: new Set(), colors: new Set(), categories: new Set(), abilities: new Set() };
    const CSV_FILENAME = 'pokemon_complete_korean_fixed_ver7.csv';

    window.onload = async function() {
        try {
            const response = await fetch(CSV_FILENAME);
            if (!response.ok) throw new Error();
            const txt = await response.text();
            parseData(txt); initGame();
        } catch (err) {
            document.getElementById('loadingArea').style.display = 'none';
            document.getElementById('setupArea').style.display = 'block';
        }
    };

    document.getElementById('dataFile').onchange = e => {
        const file = e.target.files[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = (evt) => { parseData(evt.target.result); initGame(); };
        r.readAsText(file);
    };

    function parseData(txt) {
        const lines = txt.split(/\r?\n/);
        const h = lines[0].split(',').map(x => x.trim().replace(/^\ufeff/, ''));
        const get = (row, col) => { const idx = h.indexOf(col); return idx > -1 ? row[idx]?.trim() : null; };
        
        db = lines.slice(1).filter(l => l.trim()).map(l => {
            const r = l.split(','); if (r.length < h.length) return null;
            
            let ko = get(r, 'name_ko'); 
            if (!ko) return null;
            ko = ko.normalize('NFC'); 
            
            allKoNames.push(ko);
            return {
                name: get(r, 'name_en') || get(r, 'name'), ko: ko, imagePath: get(r, 'image_path'),
                no: parseInt(get(r, 'pokedex_number')) || 0, gen: parseInt(get(r, 'generation')) || 0,
                status: get(r, 'status') || '일반', category: get(r, 'category'),
                type: [get(r, 'type_1'), get(r, 'type_2')].filter(t => t && t !== 'None'),
                h: parseFloat(get(r, 'height_m')) || 0, w: parseFloat(get(r, 'weight_kg')) || 0,
                abilities: [get(r, 'ability_1'), get(r, 'ability_2')].filter(a => a && a !== 'None'),
                hidden: get(r, 'ability_hidden'),
                stats: { hp: parseInt(get(r, 'hp'))||0, atk: parseInt(get(r, 'attack'))||0, def: parseInt(get(r, 'defense'))||0, spa: parseInt(get(r, 'sp_attack'))||0, spd: parseInt(get(r, 'sp_defense'))||0, spe: parseInt(get(r, 'speed'))||0, total: parseInt(get(r, 'total_points'))||0 },
                shape: get(r, 'shape'), color: get(r, 'pokedex_color'),
                isMega: get(r, 'is_mega') === 'TRUE', isGmax: get(r, 'is_gigantamax') === 'TRUE',
                isRegion: (get(r, 'is_alolan') === 'TRUE' || get(r, 'is_galarian') === 'TRUE' || get(r, 'is_hisuian') === 'TRUE' || get(r, 'is_paldean') === 'TRUE'),
                hasForms: get(r, 'has_forms') === 'TRUE'
            };
        }).filter(Boolean);
    }

    function initGame() {
        const lastGameSolved = localStorage.getItem('pokeSemantleLastGameSolved');
        if (lastGameSolved === 'false') {
            streak = 0;
            localStorage.setItem('pokeSemantleStreak', streak);
        }
        localStorage.setItem('pokeSemantleLastGameSolved', 'false');

        db.forEach(p => {
            p.type.forEach(t => sets.types.add(t));
            if (p.status) sets.status.add(p.status);
            if (p.shape) sets.shapes.add(p.shape);
            if (p.color) sets.colors.add(p.color);
            if (p.category) sets.categories.add(p.category);
            p.abilities.forEach(a => sets.abilities.add(a));
            if (p.hidden) sets.abilities.add(p.hidden);
        });
        targetData = db[Math.floor(Math.random() * db.length)];
        targetVec = getVector(targetData);
        calculateGlobalRanks();
        document.getElementById('loadingArea').style.display = 'none';
        document.getElementById('setupArea').style.display = 'none';
        document.getElementById('gameArea').style.display = 'block';
    }

    function getVector(p) {
        let v = [];
        for(let g=1; g<=9; g++) v.push(p.gen === g ? 1.5 : 0);
        sets.status.forEach(s => v.push(p.status === s ? 2.0 : 0));
        sets.types.forEach(t => v.push(p.type.includes(t) ? 2.0 : 0));
        sets.categories.forEach(c => v.push(p.category === c ? 2.0 : 0));
        sets.shapes.forEach(s => v.push(p.shape === s ? 1.5 : 0));
        sets.colors.forEach(c => v.push(p.color === c ? 1.5 : 0));
        ['hp','atk','def','spa','spd','spe'].forEach(k => v.push((p.stats[k] / 255) * 1.5));
        v.push((p.h / 20) * 1.5); v.push((p.w / 999) * 1.5);
        const myAbils = new Set([...p.abilities]); if(p.hidden) myAbils.add(p.hidden);
        sets.abilities.forEach(a => v.push(myAbils.has(a) ? 1.5 : 0));
        
        v.push(p.isRegion ? 0.5 : 0);
        v.push(p.isGmax ? 0.5 : 0);
        v.push(p.isMega ? 0.5 : 0);
        v.push(p.hasForms ? 0.5 : 0);
        
        return v;
    }

    function calculateGlobalRanks() {
        globalRankList = db.map(p => {
            let s = calculateCosine(getVector(p), targetVec);
            if (p.no === targetData.no && p.name === targetData.name) s = 100;
            return { ...p, score: s };
        }).sort((a, b) => b.score - a.score);
        globalRankList.forEach((p, i) => { p.rank = i + 1; });
    }

    function calculateCosine(v1, v2) {
        let dot = 0, m1 = 0, m2 = 0;
        for (let i = 0; i < v1.length; i++) { dot += v1[i] * v2[i]; m1 += v1[i] ** 2; m2 += v2[i] ** 2; }
        return m1 === 0 || m2 === 0 ? 0 : (dot / (Math.sqrt(m1) * Math.sqrt(m2))) * 100;
    }

    function getImageUrl(p) {
        const name = (p.name || '').toLowerCase();
        return `https://img.pokemondb.net/sprites/home/normal/${encodeURIComponent(name)}.png`;
    }

    function getShapeImg(shapeName) {
        if(!shapeName) return null;
        const map = {
            '머리형': './icons/Body01.png', '뱀형': './icons/Body02.png',
            '물고기형': './icons/Body03.png', '팔형': './icons/Body04.png',
            '기둥형': './icons/Body05.png', '이족꼬리형': './icons/Body06.png',
            '다리형': './icons/Body07.png', '사족형': './icons/Body08.png',
            '단익형': './icons/Body09.png', '다족형': './icons/Body10.png',
            '군집형': './icons/Body11.png', '인간형': './icons/Body12.png',
            '다익형': './icons/Body13.png', '곤충형': './icons/Body14.png'
        };
        return map[shapeName.trim()] || null;
    }

    // ✅ 색상 동그라미를 그리기 위한 함수 복구
    function getColorCode(c) {
        const map = {'빨강':'#ff5252', '파랑':'#2196f3', '노랑':'#fdd835', '초록':'#4caf50', '검정':'#333', '갈색':'#795548', '보라':'#9c27b0', '회색':'#9e9e9e', '하양':'#eee', '분홍':'#f48fb1', '담홍':'#f48fb1', 'Pink':'#f48fb1'};
        return map[c] || '#ddd';
    }

    const inputEl = document.getElementById('guessInput');
    const autoList = document.getElementById('autocomplete-list');
    let currentFocus = -1;

    inputEl.addEventListener('input', function() {
        document.getElementById('errorMsg').style.display = 'none';
        
        const val = this.value.normalize('NFC'); 
        autoList.innerHTML = ''; 
        if (!val) { autoList.style.display='none'; return; }
        currentFocus = -1;
        
        const matches = allKoNames.filter(n => n.includes(val)).slice(0, 8);
        if (matches.length > 0) {
            autoList.style.display = 'block';
            matches.forEach(name => {
                const div = document.createElement('div'); div.className = 'suggestion-item';
                div.innerHTML = name.replace(new RegExp(`(${val})`, "i"), "<strong style='color:var(--primary)'>$1</strong>");
                div.onclick = () => { inputEl.value = name; autoList.style.display='none'; handleGuess(); };
                autoList.appendChild(div);
            });
        }
    });

    inputEl.addEventListener('keydown', function(e) {
        if (e.isComposing || e.keyCode === 229) return; 

        let x = autoList.getElementsByTagName('div');
        if (e.key === 'ArrowDown') { currentFocus++; addActive(x); }
        else if (e.key === 'ArrowUp') { currentFocus--; addActive(x); }
        else if (e.key === 'Enter') {
            e.preventDefault();
            if (currentFocus > -1 && x.length > 0) x[currentFocus].click(); 
            else handleGuess();
        }
    });

    function addActive(x) {
        if (!x) return; removeActive(x);
        if (currentFocus >= x.length) currentFocus = 0;
        if (currentFocus < 0) currentFocus = x.length - 1;
        x[currentFocus].classList.add('active'); x[currentFocus].scrollIntoView({ block: "nearest" });
    }
    function removeActive(x) { for(let i=0; i<x.length; i++) x[i].classList.remove('active'); }
    
    document.addEventListener('click', e => { if (e.target !== inputEl) { autoList.innerHTML = ''; autoList.style.display = 'none'; } });

    function handleGuess() {
        // ✅ 정답을 맞춰도 계속 입력할 수 있게 방어막 해제
        // if(gameSolved) return; 

        const errorEl = document.getElementById('errorMsg');
        errorEl.style.display = 'none';

        const val = inputEl.value.trim().normalize('NFC');
        if (!val) return;

        const pData = db.find(d => d.ko === val);

        if (!pData) {
            errorEl.innerText = "🚨 도감에 없는 포켓몬입니다. 이름을 확인해 주세요!";
            errorEl.style.display = 'block';
            return;
        }

        if (history.find(h => h.ko === val)) {
            errorEl.innerText = "🚨 이미 확인해 본 포켓몬입니다!";
            errorEl.style.display = 'block';
            inputEl.value = "";
            return;
        }

        const rankIdx = globalRankList.findIndex(x => x.name === pData.name);
        const currentRank = rankIdx + 1;
        
        // 정답을 맞힌 이후의 입력은 시도 횟수에 포함하지 않음
        if (!gameSolved) {
            tryCount++;
            if (currentRank > 1 && currentRank < bestRank) { bestRank = currentRank; }
        }

        history.unshift({ ...pData, rank: currentRank, score: globalRankList[rankIdx].score, tryNo: gameSolved ? '-' : tryCount });
        renderHistory(); 
        inputEl.value = "";
        autoList.style.display = 'none';

        // 게임을 맞췄고, 첫 성공일 때만 폭죽 터뜨림
        if (currentRank === 1 && !gameSolved) { 
            handleWin(val); 
        }
    }

    function handleWin(pokemonName) {
        gameSolved = true;
        streak++;
        maxStreak = Math.max(maxStreak, streak);
        solvedGameCount++;
        totalTrySum += tryCount;

        if (bestRank !== Infinity) {
            worstBestRank = worstBestRank === 0 ? bestRank : Math.max(worstBestRank, bestRank);
        }

        localStorage.setItem('pokeSemantleStreak', streak);
        localStorage.setItem('pokeSemantleMaxStreak', maxStreak);
        localStorage.setItem('pokeSemantleSolvedGameCount', solvedGameCount);
        localStorage.setItem('pokeSemantleTotalTrySum', totalTrySum);
        localStorage.setItem('pokeSemantleWorstBestRank', worstBestRank);
        localStorage.setItem('pokeSemantleLastGameSolved', 'true');

        // ✅ 정답 이후에도 계속 검색 가능하므로 입력창은 숨기지 않음
        document.getElementById('successArea').style.display = 'block';
        
        document.getElementById('answerName').innerText = pokemonName;
        document.getElementById('streakCount').innerText = streak;
        document.getElementById('maxStreakDisplay').innerText = maxStreak;
        document.getElementById('tryCountDisplay').innerText = `${tryCount}회`;
        document.getElementById('avgTryDisplay').innerText = solvedGameCount > 0 ? `${(totalTrySum / solvedGameCount).toFixed(2)}회` : '-';
        document.getElementById('bestRankDisplay').innerText = bestRank === Infinity ? '-' : `${bestRank}위`;
        document.getElementById('worstBestRankDisplay').innerText = worstBestRank > 0 ? `${worstBestRank}위` : '-';

        if (typeof confetti === 'function') {
            const duration = 3000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

            function randomInRange(min, max) { return Math.random() * (max - min) + min; }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);
                
                const particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }
    }

    function renderHistory() {
        const container = document.getElementById('historyList'); container.innerHTML = '';
        if (history.length === 0) return;
        container.appendChild(createCard(history[0], true, true));
        if (history.length > 1) {
             const div = document.createElement('div'); div.className = 'list-divider'; div.innerText = '순위별 정렬'; container.appendChild(div);
             history.slice(1).sort((a,b)=>a.rank-b.rank).forEach(p => container.appendChild(createCard(p, expandedCards.has(p.ko), true)));
        }
    }

    function createCard(p, isExpanded, isInteractive, lazyBody = false) {
        const el = document.createElement('div'); el.className = `card ${isExpanded ? 'expanded' : ''}`;
        const imgUrl = getImageUrl(p);
        const typeHtml = p.type.map(t => `<span class="type-badge" style="background:${getPastelColor(t)}; color:${getTypeColor(t)}">${t}</span>`).join('');
        const shapeImg = getShapeImg(p.shape);
        const shapeContent = shapeImg ? `<img src="${shapeImg}" class="shape-icon" title="${p.shape}">` : (p.shape || '-');
        const buildBodyHtml = () => {
            const radarSvg = getRadarChartSVG(p.stats);
            return `
                <div class="grid-layout">
                    <div class="col-left"><div class="big-img-box"><img src="${imgUrl}" class="big-img" onerror="this.src='https://via.placeholder.com/220x220?text=No+Image';"></div></div>
                    <div class="col-mid">
                        <div class="info-column">
                            <div class="info-row"><span class="label-text">이름:</span><span class="val-text">${p.ko}</span></div>
                            <div class="info-row"><span class="label-text">번호:</span><span class="val-text">No.${String(p.no).padStart(4,'0')}</span></div>
                            <div class="info-row"><span class="label-text">구분:</span><span class="val-text">${p.status}포켓몬</span></div>
                            <div class="info-row"><span class="label-text">특성:</span><span class="val-text">${p.abilities.join(', ')}</span></div>
                            <div class="info-row"><span class="label-text">숨특:</span><span class="val-text">${p.hidden || '없음'}</span></div>
                            <div class="info-row"><span class="label-text">기타:</span><span class="val-text">${boolStr}</span></div>
                        </div>
                        <div class="info-column">
                            <div class="info-row"><span class="label-text">세대:</span><span class="val-text">${p.gen}세대</span></div>
                            <div class="info-row"><span class="label-text">분류:</span><span class="val-text">${p.category || '-'}</span></div>
                            <div class="info-row"><span class="label-text">타입:</span><div>${typeHtml}</div></div>
                            <div class="info-row"><span class="label-text">체형:</span><span class="val-text">${shapeContent}</span></div>
                            <div class="info-row">
                                <span class="label-text">색상:</span>
                                <span class="val-text">
                                    ${p.color || '-'} 
                                    ${p.color ? `<span style="width:12px;height:12px;border-radius:50%;background:${colorDot};border:1px solid #ccc;margin-left:2px;"></span>` : ''}
                                </span>
                            </div>
                            <div class="info-row"><span class="label-text">크기:</span><span class="val-text">${p.h}m / ${p.w}kg</span></div>
                        </div>
                    </div>
                    <div class="col-right"><div class="radar-chart-box">${radarSvg}</div></div>
                </div>`;
        };

        if (isInteractive) {
            el.onclick = () => {
                const expanded = el.classList.toggle('expanded');
                if (expanded) {
                    expandedCards.add(p.ko);
                    if (lazyBody) {
                        const bodyEl = el.querySelector('.card-body');
                        if (bodyEl && !bodyEl.dataset.loaded) {
                            bodyEl.innerHTML = buildBodyHtml();
                            bodyEl.dataset.loaded = 'true';
                        }
                    }
                } else {
                    expandedCards.delete(p.ko);
                }
            };
        }
        
        let boolTags = [];
        if(p.isMega) boolTags.push("메가진화");
        if(p.isGmax) boolTags.push("거다이맥스");
        if(p.isRegion) boolTags.push("리전폼");
        if(p.hasForms) boolTags.push("여러모습");
        const boolStr = boolTags.length > 0 ? boolTags.join(', ') : "없음";

        // ✅ 대체할 코드
        // 1위는 0.8 농도. 순위가 내려갈수록 선형적으로 천천히 연해지도록(최소 0.15) 수정
        const gaugeOpacity = Math.max(0.15, 0.8 - ((p.rank - 1) / db.length) * 0.65);
        
        // ✅ 색상 동그라미 추출
        const colorDot = getColorCode(p.color);

        el.innerHTML = `
            <div class="card-header">
                <div class="rank-gauge" style="width:${Math.max(5, ((db.length - p.rank) / db.length) * 100)}%; background:rgba(255, 82, 82, ${gaugeOpacity});"></div>
                <div class="header-content">
                    <span class="try-badge">${p.tryNo ? (p.tryNo === '-' ? '-' : '#'+p.tryNo) : '-'}</span>
                    <img src="${imgUrl}" class="mini-img" onerror="this.src='https://via.placeholder.com/40';">
                    <span class="header-name">${p.ko}</span>
                    <div class="rank-score-wrapper">
                        <span class="score-disp">${p.score.toFixed(2)}%</span>
                        <span class="rank-disp">${p.rank}위</span>
                    </div>
                </div>
            </div>
            <div class="card-body" ${lazyBody ? 'data-loaded="false"' : ''}>${lazyBody ? (isExpanded ? buildBodyHtml() : '') : buildBodyHtml()}</div>`;
        if (lazyBody && isExpanded) {
            const bodyEl = el.querySelector('.card-body');
            if (bodyEl) bodyEl.dataset.loaded = 'true';
        }
        return el;
    }

    function openRankingTab() {
        const win = window.open('', '_blank');
        if (!win) return;

        const styles = document.querySelector('style').innerHTML;
        const rankingCards = globalRankList.map(p => createCard(p, false, false).outerHTML).join('');

        win.document.write(`<html><head><title>🏆 전체 순위표</title><meta name="referrer" content="no-referrer"><base href="${window.location.href}"><link rel="icon" type="image/png" href="pokemon%20semantle%20icon.png"><link rel="apple-touch-icon" href="pokemon%20semantle%20icon.png"><style>${styles} .history-list{gap:6px !important;} .card{margin-bottom:0 !important;}</style></head>
            <body style="background:#f0f2f5"><div class="container" style="max-width:900px;margin:0 auto;padding:24px 40px;">
            <h1 style="text-align:center;color:#2c3e50;margin-bottom:20px;">🏆 전체 순위표</h1><div class="history-list">${rankingCards}</div></div>
            <script>document.querySelectorAll('.card').forEach(c=>c.onclick=()=>c.classList.toggle('expanded'))<\/script></body></html>`);
        win.document.close();
    }

    function getRadarChartSVG(s) {
        const size=130, center=65, radius=40, max=255, keys=['hp','atk','def','spe','spd','spa'], labels=['HP','공격','방어','스피드','특방','특공'];
        const pts = keys.map((k,i)=>{ const a=i*(Math.PI*2/6)-Math.PI/2, r=(s[k]/max)*radius; return `${center+r*Math.cos(a)},${center+r*Math.sin(a)}`; }).join(' ');
        const bg = keys.map((_,i)=>{ const a=i*(Math.PI*2/6)-Math.PI/2; return `${center+radius*Math.cos(a)},${center+radius*Math.sin(a)}`; }).join(' ');
        const lbls = labels.map((l,i)=>{ const a=i*(Math.PI*2/6)-Math.PI/2, r=radius+15, x=center+r*Math.cos(a), y=center+r*Math.sin(a); 
            return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#555" font-weight="bold"><tspan x="${x}" dy="-5">${l}</tspan><tspan x="${x}" dy="11" font-weight="normal" fill="#333">${s[keys[i]]}</tspan></text>`; }).join('');
        return `<svg viewBox="0 0 130 130"><polygon points="${bg}" fill="#f8f8f8" stroke="#ddd"/><polygon points="${pts}" fill="rgba(255,82,82,0.3)" stroke="#ff5252" stroke-width="1.5"/>${lbls}</svg>`;
    }

    function getTypeColor(t) { const m={'노말':'#6D6D4E','불꽃':'#9C531F','물':'#445E9C','전기':'#A1871F','풀':'#4E8234','얼음':'#638D8D','격투':'#7D1F1A','독':'#682A68','땅':'#927D44','비행':'#6D5E9C','에스퍼':'#9C295B','벌레':'#6D7815','바위':'#786824','고스트':'#493963','드래곤':'#4924A1','악':'#49392F','강철':'#787887','페어리':'#9B4A7D'}; return m[t]||'#555'; }
    function getPastelColor(t) { const m={'노말':'#A8A77A','불꽃':'#EE8130','물':'#6390F0','전기':'#F7D02C','풀':'#7AC74C','얼음':'#96D9D6','격투':'#C22E28','독':'#A33EA1','땅':'#E2BF65','비행':'#A98FF3','에스퍼':'#F95587','벌레':'#A6B91A','바위':'#B6A136','고스트':'#735797','드래곤':'#6F35FC','악':'#705746','강철':'#B7B7CE','페어리':'#D685AD'}; const c=m[t]||'#ccc'; const r=parseInt(c.slice(1,3),16), g=parseInt(c.slice(3,5),16), b=parseInt(c.slice(5,7),16); return `rgba(${r},${g},${b},0.2)`; }
</script>
</body>
